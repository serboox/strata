<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 424" role="img" aria-label="Data flow" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="424" rx="12" fill="#ffffff" stroke="#e2e8f0"/><title>Data flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a6577"/></marker></defs><rect x="20" y="150" width="130" height="90" rx="10" fill="#eef2f7" stroke="#d9dee7" stroke-width="1.5"/><text x="85" y="180" font-size="17" fill="#1b2230" text-anchor="middle" font-weight="700">SSD</text><text x="85" y="202" font-size="12.5" fill="#5a6577" text-anchor="middle" font-weight="400">GGUF 22.9 GB</text><text x="85" y="222" font-size="12.5" fill="#5a6577" text-anchor="middle" font-weight="400">3.5 GB/s</text><rect x="195" y="60" width="195" height="260" rx="10" fill="#fff1e0" stroke="#ea580c" stroke-width="1.5"/><text x="292" y="88" font-size="15" fill="#1b2230" text-anchor="middle" font-weight="700">System RAM</text><text x="292" y="110" font-size="12.5" fill="#5a6577" text-anchor="middle" font-weight="400">page cache: 8–22 GB</text><rect x="214" y="130" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="214" y="149" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="214" y="168" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="214" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="234" y="130" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="234" y="149" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="234" y="168" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="234" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="254" y="130" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="254" y="149" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="254" y="168" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="254" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="274" y="130" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="274" y="149" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="274" y="168" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="274" y="187" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="294" y="130" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="294" y="149" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="294" y="168" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="294" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="314" y="130" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="314" y="149" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="314" y="168" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="314" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="334" y="130" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="334" y="149" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="334" y="168" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="334" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="354" y="130" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="354" y="149" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><rect x="354" y="168" width="15" height="15" rx="3" fill="#fbd9b8" opacity="0.7"/><rect x="354" y="187" width="15" height="15" rx="3" fill="#ea580c" opacity="0.9"/><text x="292" y="232" font-size="12" fill="#5a6577" text-anchor="middle" font-weight="400">10,240 experts, 1.9 MB each</text><text x="292" y="252" font-size="12" fill="#5a6577" text-anchor="middle" font-weight="400">read from the file in place</text><text x="292" y="290" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="600">the hottest stay resident</text><rect x="460" y="60" width="116" height="130" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="518" y="88" font-size="16" fill="#1b2230" text-anchor="middle" font-weight="700">CPU</text><text x="518" y="110" font-size="12.5" fill="#5a6577" text-anchor="middle" font-weight="400">4 threads</text><text x="518" y="140" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">8 experts</text><text x="518" y="160" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="400">per layer,</text><text x="518" y="176" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="400">per token</text><rect x="460" y="222" width="252" height="128" rx="10" fill="#dcf5e6" stroke="#16a34a" stroke-width="1.5"/><text x="586" y="246" font-size="15" fill="#1b2230" text-anchor="middle" font-weight="700">GPU, 4 GB of VRAM</text><text x="586" y="268" font-size="12" fill="#5a6577" text-anchor="middle" font-weight="400">attention, recurrent layers,</text><text x="586" y="285" font-size="12" fill="#5a6577" text-anchor="middle" font-weight="400">shared expert, output head</text><text x="586" y="308" font-size="12.5" fill="#16a34a" text-anchor="middle" font-weight="600">weights 2.0 GiB + q8 K/V 0.73 GiB</text><text x="586" y="330" font-size="12" fill="#5a6577" text-anchor="middle" font-weight="400">+ work buffers</text><line x1="150" y1="195" x2="193" y2="195" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/><line x1="392" y1="125" x2="458" y2="125" stroke="#ea580c" stroke-width="3" marker-end="url(#ah)"/><text x="425" y="150" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="600">0.63 GB</text><text x="425" y="165" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="600">per token</text><line x1="500" y1="220" x2="500" y2="192" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ah)"/><text x="492" y="210" font-size="11.5" fill="#16a34a" text-anchor="end" font-weight="600">experts</text><line x1="552" y1="192" x2="552" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/><text x="560" y="210" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="600">outputs</text><rect x="590" y="60" width="122" height="130" rx="10" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/><text x="651" y="82" font-size="12.5" fill="#1b2230" text-anchor="middle" font-weight="700">one layer ×40</text><text x="651" y="106" font-size="11.5" fill="#5a6577" text-anchor="middle" font-weight="400">1. GPU: attention</text><text x="651" y="126" font-size="11.5" fill="#5a6577" text-anchor="middle" font-weight="400">2. router: 8 of 256</text><text x="651" y="146" font-size="11.5" fill="#5a6577" text-anchor="middle" font-weight="400">3. CPU computes</text><text x="651" y="166" font-size="11.5" fill="#5a6577" text-anchor="middle" font-weight="400">4. GPU adds up</text><path d="M85 242 C85 372 330 372 458 312" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="20" y="392" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="600">long prompt: chunks of 512 tokens, the experts stream through the page cache to the GPU</text><text x="20" y="410" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="600">while the CPU computes 96 of the 256 experts of each layer next to the card</text></svg>
